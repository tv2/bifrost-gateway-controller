name: Getting-started-usecase

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7
        with:
          fetch-depth: 0

      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # tag=v0.16.0
        with:
          enable-cache: true

      - name: Setup getting-started usecase
        run: |
          devbox run -- make setup-getting-started

      - name: Verify getting-started usecase
        run: |
          devbox run -- make wait-ready-getting-started-usecase tryout-getting-started-usecase
