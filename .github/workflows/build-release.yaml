name: Build release

on:
  push:
    tags:
      - '*'
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # tag=v0.13.0

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          devbox run -- make test


  release:
    runs-on: ubuntu-latest
    needs: ["tests"]
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # tag=v0.13.0

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Login to GitHub Container Registry
        env:
          GH_ACTOR: ${{ github.actor }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GH_ACTOR --password-stdin

      # Build release manifests - not to release these, but to force a failure
      # below if repo does not already contain updated manifests
      - name: Build release manifests
        run: |
          rm -rf config/release
          devbox run -- make manifest-build

      - name: Build and push container image
        id: ko
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          IMAGE=$(devbox run -- make container | tail -1)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

    outputs:
      image: ${{ steps.ko.outputs.image }}


  sign:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: none
      packages: write
      id-token: write

    steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # tag=v3.9.2

    - name: Sign container
      run: cosign sign --yes ${{ needs.release.outputs.image }}


  verify:
    needs: [ release, sign ]
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # tag=v3.9.2

    - name: Verify signature
      run: cosign verify --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/build-release.yaml@refs/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com ${{ needs.release.outputs.image }}
